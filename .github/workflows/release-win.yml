name: Build Windows Test Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Package Windows (test)
        run: node scripts/build.mjs --env=test --platforms=win

      - name: List artifacts
        shell: pwsh
        run: |
          if (Test-Path release) {
            Get-ChildItem -Recurse release | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host 'no release dir'
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tongguanbao-proxy-win-setup
          path: release/**/*.exe
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.exe
          generate_release_notes: true
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
