appId: com.company.tongguanbao-proxy
productName: 通关宝 proxy
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - dist/renderer/**
  - src/main/**
  - src/preload/**
  - src/shared/**
  - package.json
  - '!**/*.map'

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  # icon: build/icon.ico

# 没有代码签名证书，显式跳过签名；产物仍需右键「打开」绕过 Gatekeeper
mac:
  target:
    - target: dmg
      arch:
        - arm64
  identity: null
  category: public.app-category.utilities

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}

nsis:
  # 向导安装：可选目录；仅当前用户，避免选「所有用户」后 UAC 失败静默退出
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  differentialPackage: true
  # 固定安装包文件名（不带版本号）：同名覆盖式投放，更新服务器不留历史版本。
  # 差分更新不受影响（electron-updater 靠 latest.yml 的 sha512 + 新旧 blockmap 对比，与文件名无关）
  artifactName: ${name}-Setup.${ext}
  # 控制面板「卸载程序」里显示的名字，避免拼上 package.json 的 author 占位
  uninstallDisplayName: ${productName}

# 在线更新 feed（对接文档 §8）：此处写生产地址用于生成包内 app-update.yml；
# scripts/build.mjs 会按 --env 覆盖为对应环境，运行时 updater.js 再按 appEnv setFeedURL 兜底。
# 本地构建 publish 策略为 never，这里的配置只影响生成的 app-update.yml，不会上传任何东西。
publish:
  provider: generic
  url: https://www.danaai.net/astongai/agent-update/
  useMultipleRangeRequest: false
